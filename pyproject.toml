[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "klipperai"
version = "0.1.0"
description = "Moonraker-integrated LLM assistant for Klipper and Kalico printers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=1.10.15,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.26,<1.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
klipperai-agent = "klipperai_agent.__main__:main"
klipperai-detect-profile = "klipperai_agent.cli.detect_profile:main"
klippyai-agent = "klipperai_agent.cli.legacy:agent_main"
klippyai-detect-profile = "klipperai_agent.cli.legacy:detect_main"

[tool.hatch.build.targets.wheel]
packages = ["klipperai_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.gitignore",
  "/README.md",
  "/deployment",
  "/docs",
  "/pyproject.toml",
  "/klipperai_agent",
  "/tools",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=klipperai_agent",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["klipperai_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
  "if __name__ == .__main__.:",
]
