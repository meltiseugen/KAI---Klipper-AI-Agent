name: Linux quality and release artifacts

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      SKIP_CYTHON: '1'
      MARKUPSAFE_SKIP_SPEEDUPS: '1'
      KLIPPERAI_REQUIRE_NGINX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - name: Install real reverse-proxy test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Lint and format
        run: |
          uv run --no-sync ruff check klipperai_agent tests tools deployment integrations
          uv run --no-sync ruff format --check klipperai_agent tests tools deployment integrations
      - run: uv run --no-sync mypy klipperai_agent integrations --ignore-missing-imports
      - run: uv run --no-sync python tools/project_map.py --check
      - name: Tests with mandatory 100 percent coverage
        run: uv run --no-sync python -m pytest --junitxml=.local/reports/pytest.xml --cov-report=xml:.local/reports/coverage.xml
      - name: Browser-state and installer checks
        run: |
          node --test tests/*.test.mjs
          bash install.sh --check
          sh -n deployment/installer/bootstrap.sh
          sh -n deployment/installer/entware.sh
          bash -n uninstall.sh
      - name: Native init lifecycle, boot, code update and rollback
        run: sudo env KLIPPERAI_REQUIRE_NATIVE=1 .venv/bin/python -m pytest tests/test_native_host_boot.py --no-cov -p no:cacheprovider --basetemp="$RUNNER_TEMP/klipperai-native-root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-python-${{ matrix.python }}
          path: .local/reports/
          retention-days: 7
          if-no-files-found: ignore

  packages:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv build --wheel --sdist --out-dir dist
      - name: Validate version, contents and checksums
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            uv run --no-sync python -m tools.release_artifacts dist --tag "$GITHUB_REF_NAME"
          else
            uv run --no-sync python -m tools.release_artifacts dist
          fi
      - name: Smoke-test a runtime-only installation outside the checkout
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          uv run --no-sync python -m tools.smoke_installed --python "$RUNNER_TEMP/installed/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klipperai-release-artifacts
          path: dist/
          retention-days: 14
          if-no-files-found: error
